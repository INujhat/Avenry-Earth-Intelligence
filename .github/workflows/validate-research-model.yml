name: Validate Avenry research model (isolated)
on:
  push:
    branches: [research/validated-ai-pipeline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/validated-ai-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-cpu.txt
          python -m pip check
      - name: Download and verify bounded research subset
        run: |
          python -m scripts.prepare_subset
          cp data/subset-manifest.json data/manifest.json
      - name: Train pilot U-Net on event-disjoint split
        run: python -m ml.train --epochs 35
      - name: Run automated tests
        run: |
          # Browser export settings are generated locally and are not deployment inputs.
          rm -f frontend/.env.browser
          python -m pytest -q
      - name: Verify checkpoint and evaluation metadata exist
        run: |
          test -s artifacts/baseline/model.pt
          test -s artifacts/baseline/model.json
          python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path('artifacts/baseline/model.json').read_text())
          print('Model metadata keys:',sorted(info))
          assert info.get('checkpoint_sha256'), 'Missing checkpoint integrity hash'
          PY
      - name: Preserve research evidence privately as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: avenry-pilot-research-evidence
          path: |
            artifacts/baseline/model.pt
            artifacts/baseline/model.json
            data/subset-manifest.json
          retention-days: 7
      # Deliberately no public deployment, and no model or dataset uploads.
      # Review evaluation, licensing and geospatial correctness before publication.
