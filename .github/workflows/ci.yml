name: Quality and real-sample integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip check
      - run: python -m ruff check backend ml scripts
      - run: python -m ruff format --check backend ml scripts
      - run: python -m scripts.prepare_sample
      - run: python -m ml.train --demo --epochs 35
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
