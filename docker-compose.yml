services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: terrasense
      POSTGRES_DB: terrasense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U terrasense -d terrasense]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - 127.0.0.1:8000:8000
    environment:
      DATABASE_URL: postgresql+psycopg://terrasense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/terrasense
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
